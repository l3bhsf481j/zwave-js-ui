name: 'Z-Wave Bot: React to comments'
jobs:
  fix-lint:
    if: |
      contains(github.event.issue.html_url, '/pull/') &&
      contains(github.event.comment.body, '@zwave-js-bot fix lint') &&
      (github.event.comment.user.login != 'zwave-js-bot' && github.event.comment.user.login != 'zwave-js-assistant[bot]')
    runs-on:
    - ubuntu-latest
    strategy:
      matrix:
        node-version:
        - 20.x
    steps:
    - name: Checkout master branch
      uses: actions/checkout@v5.0.1
      with:
        path: trusted
    - name: Check user's permissions to do this
      id: check-permissions
      uses: actions/github-script@v3
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        result-encoding: string
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/trusted/.github/bot-scripts/index.js`);
          return bot.checkAuthorized({github, context});
    - name: Retrieve PR information
      if: steps.check-permissions.outputs.result == 'true'
      id: pr-info
      uses: actions/github-script@v3
      with:
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/trusted/.github/bot-scripts/index.js`);
          const result = await bot.getFixLintInfo({github, context});
          console.dir(result);
          return result || {pending: true};
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-patch-download check-permissions=${{ steps.check-permissions.outputs.result }}"
        printf '%s\n' "GERALT_DBG pr-info result (raw): ${{ steps.pr-info.outputs.result }}"
        printf '%s\n' "GERALT_DBG workspace contents:"
        ls -la "$GITHUB_WORKSPACE" 2>/dev/null || echo "GERALT_DBG workspace listing failed"
        echo "GERALT_DBG trusted bot-scripts exists?"
        ls -la "$GITHUB_WORKSPACE/trusted/.github/bot-scripts" 2>/dev/null || echo "GERALT_DBG trusted bot-scripts missing"
      continue-on-error: true
    - name: Download Lint patch
      if: |
        steps.check-permissions.outputs.result == 'true' &&
        !fromJSON(steps.pr-info.outputs.result).pending
      env:
        PATCH_URL: ${{ fromJSON(steps.pr-info.outputs.result).patchUrl }}
      run: |
        mkdir -p patch
        cd patch
        curl "$PATCH_URL" -o patch.zip
        unzip patch.zip
    - name: Do the lint fix
      id: fix
      run: |
        echo "result=unchanged" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-sink: checking whether trusted bot module was overwritten"
        TRUSTED_INDEX="$GITHUB_WORKSPACE/trusted/.github/bot-scripts/index.js"
        if [ -f "$TRUSTED_INDEX" ]; then
          echo "GERALT_DBG trusted index.js present"
          sha256sum "$TRUSTED_INDEX" 2>/dev/null || echo "GERALT_DBG sha256 unavailable"
          echo "GERALT_DBG --- head of trusted index.js ---"
          head -n 40 "$TRUSTED_INDEX" 2>/dev/null || echo "GERALT_DBG head failed"
          echo "GERALT_DBG --- end head ---"
        else
          echo "GERALT_DBG trusted index.js NOT present (unzip may have failed or step skipped)"
        fi
        echo "GERALT_DBG patch dir contents:"
        ls -la "$GITHUB_WORKSPACE/patch" 2>/dev/null || echo "GERALT_DBG patch dir missing"
        echo "GERALT_DBG fix output result=${{ steps.fix.outputs.result }}"
      continue-on-error: true
    - name: Give feedback
      if: steps.check-permissions.outputs.result == 'true'
      uses: actions/github-script@v3
      env:
        FEEDBACK: ${{ steps.fix.outputs.result }}
        PENDING: ${{ fromJSON(steps.pr-info.outputs.result).pending }}
      with:
        github-token: ${{secrets.BOT_TOKEN}}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/trusted/.github/bot-scripts/index.js`);
          return bot.fixLintFeedback({github, context});
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
